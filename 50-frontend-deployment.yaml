apiVersion: apps/v1
kind: Deployment
metadata:
  name: cheapkart-frontend
  namespace: cheapkart
  labels:
    app.kubernetes.io/name: cheapkart-frontend
    app.kubernetes.io/part-of: cheapkart
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cheapkart-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cheapkart-frontend
        app.kubernetes.io/part-of: cheapkart
    spec:
      containers:
        - name: frontend
          image: vikrant9850/cheapkart-frontend:f17afbb93ea33bf84d38c636ade6596bb48ec032
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
